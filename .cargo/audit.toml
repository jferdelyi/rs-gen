# Settings of cargo audit, read by scripts/verify.sh and by the audit workflow of the CI.
[advisories]
# RUSTSEC-2026-0258: h2 0.3 sends unbounded empty DATA frames, with no fix in the 0.3 branch. h2
# comes with the http2 feature of actix-web, but the server binds with HttpServer::bind, which
# serves HTTP/1.x only (HttpService::tcp): the HTTP/2 code of h2 is never reached.
ignore = ["RUSTSEC-2026-0258"]
