[workspace]
members = ["rs-gen-core",
    "rs-gen-server",
    "rs-gen-exemple"
]
resolver = "3"

# Shared by every crate of the workspace
[workspace.package]
license = "EPL-2.0"

# Any warning, from rustc or clippy, fails the build
[workspace.lints.rust]
warnings = "deny"
# No unsafe code in any crate
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3            # Maximum optimization
lto = "fat"              # Aggressive link-time optimization
strip = true             # Strip debug symbols
panic = "abort"          # Slightly faster

