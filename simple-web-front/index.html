<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Markov Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="A configurable word generator based on Markov chains.">
  <meta name="theme-color" content="#161b22">

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Markov Generator">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

  <div class="app">
    <div class="card generator-card">

      <!-- Terminal -->
      <div id="terminal" class="terminal"></div>
      <!-- The terminal writes each word letter by letter: the whole word is announced here -->
      <p id="announcer" class="visually-hidden" role="status"></p>

      <!-- Generate / Reset -->
      <div class="generate-row">
        <button id="generate-btn" class="primary-btn" title="Generate a new word">
          Generate
        </button>

        <button id="reset-btn" class="icon-btn" title="Clear terminal output" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 1 1 17.5 6.5L20 9"/><polyline points="20 3.5 20 9 14.5 9"/></svg>
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="open-settings" class="action-btn" title="Open configuration panel">
          Settings
        </button>

        <button id="copy-command" class="action-btn"
          title="Copy the API request triggered when clicking Generate"
          disabled>
          Copy API URL
        </button>

        <a href="https://github.com/jferdelyi/rs-gen"
           target="_blank"
           rel="noopener"
           class="icon-btn"
           title="View source code on GitHub"
           aria-label="GitHub repository">
          <svg viewBox="0 -0.5 25 25" fill="currentColor" aria-hidden="true"><path d="m12.301 0h.093c2.242 0 4.34.613 6.137 1.68l-.055-.031c1.871 1.094 3.386 2.609 4.449 4.422l.031.058c1.04 1.769 1.654 3.896 1.654 6.166 0 5.406-3.483 10-8.327 11.658l-.087.026c-.063.02-.135.031-.209.031-.162 0-.312-.054-.433-.144l.002.001c-.128-.115-.208-.281-.208-.466 0-.005 0-.01 0-.014v.001q0-.048.008-1.226t.008-2.154c.007-.075.011-.161.011-.249 0-.792-.323-1.508-.844-2.025.618-.061 1.176-.163 1.718-.305l-.076.017c.573-.16 1.073-.373 1.537-.642l-.031.017c.508-.28.938-.636 1.292-1.058l.006-.007c.372-.476.663-1.036.84-1.645l.009-.035c.209-.683.329-1.468.329-2.281 0-.045 0-.091-.001-.136v.007c0-.022.001-.047.001-.072 0-1.248-.482-2.383-1.269-3.23l.003.003c.168-.44.265-.948.265-1.479 0-.649-.145-1.263-.404-1.814l.011.026c-.115-.022-.246-.035-.381-.035-.334 0-.649.078-.929.216l.012-.005c-.568.21-1.054.448-1.512.726l.038-.022-.609.384c-.922-.264-1.981-.416-3.075-.416s-2.153.152-3.157.436l.081-.02q-.256-.176-.681-.433c-.373-.214-.814-.421-1.272-.595l-.066-.022c-.293-.154-.64-.244-1.009-.244-.124 0-.246.01-.364.03l.013-.002c-.248.524-.393 1.139-.393 1.788 0 .531.097 1.04.275 1.509l-.01-.029c-.785.844-1.266 1.979-1.266 3.227 0 .025 0 .051.001.076v-.004c-.001.039-.001.084-.001.13 0 .809.12 1.591.344 2.327l-.015-.057c.189.643.476 1.202.85 1.693l-.009-.013c.354.435.782.793 1.267 1.062l.022.011c.432.252.933.465 1.46.614l.046.011c.466.125 1.024.227 1.595.284l.046.004c-.431.428-.718 1-.784 1.638l-.001.012c-.207.101-.448.183-.699.236l-.021.004c-.256.051-.549.08-.85.08-.022 0-.044 0-.066 0h.003c-.394-.008-.756-.136-1.055-.348l.006.004c-.371-.259-.671-.595-.881-.986l-.007-.015c-.198-.336-.459-.614-.768-.827l-.009-.006c-.225-.169-.49-.301-.776-.38l-.016-.004-.32-.048c-.023-.002-.05-.003-.077-.003-.14 0-.273.028-.394.077l.007-.003q-.128.072-.08.184c.039.086.087.16.145.225l-.001-.001c.061.072.13.135.205.19l.003.002.112.08c.283.148.516.354.693.603l.004.006c.191.237.359.505.494.792l.01.024.16.368c.135.4         </a>

        <a href="admin.html"
           class="icon-btn"
           title="Model administration"
           aria-label="Model administration">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.75" r="1.25" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>

    </div>

    <!-- On a wide screen, the weights of the models next to the terminal: script.js moves them
         here from the settings dialog. After the terminal in the page, so that the keyboard
         reaches Generate first -->
    <aside id="weights-panel" class="card weights-panel" aria-labelledby="weights-panel-title">
      <h2 id="weights-panel-title">Model Weights</h2>
    </aside>
  </div>

  <!-- Settings Modal -->
  <dialog id="settings-modal" class="modal" aria-labelledby="settings-title">
    <div class="modal-content">

      <!-- General Settings. The dialog opens on its title: Safari would draw the focus ring
           on the first slider, even after a mouse click. Tab leads to the slider. -->
      <h3 id="settings-title" tabindex="-1" autofocus>General Settings</h3>

      <div class="input-group">
        <label for="randomness" class="label-title">
          Randomness
        </label>
        <div class="slider-inline">
          <input type="range"
                 id="randomness"
                 min="0"
                 max="1"
                 step="0.01"
                 value="0.1"
                 title="Adjust the level of randomness applied during prediction">
          <span id="randomness-val" class="slider-value">0.10</span>
        </div>
      </div>

      <div class="input-group">
        <label for="max_n" class="label-title">
          Maximum n-gram order
        </label>
        <div class="slider-inline">
          <input type="range"
                 id="max_n"
                 min="0"
                 max="100"
                 step="1"
                 value="0"
                 title="Limit the maximum n-gram order used for prediction">
          <span id="max_n-val" class="slider-value">No limit</span>
        </div>
      </div>

      <div class="input-group">
        <label for="nb_try" class="label-title">
          Retry Attempts
        </label>
        <div class="slider-inline">
          <input type="range"
                 id="nb_try"
                 min="1"
                 max="100"
                 step="1"
                 value="1"
                 title="Number of retries if the generated word already exists in the training dataset">
          <span id="nb_try-val" class="slider-value">1</span>
        </div>
      </div>

      <label title="Add more randomness to predictions">
        <input type="checkbox" id="reduce_random">
        Advance randomness
      </label>

      <!-- Seed Options -->
      <div id="seed-options">
        <h3>Seed Configuration</h3>

        <label class="seed-option" title="Generate without an initial seed">
          <input type="radio" name="seed" value="none" checked>
          <span>No seed</span>
        </label>

        <label class="seed-option" title="Provide a custom starting sequence">
          <input type="radio" name="seed" value="custom">
          <span id="custom-seed-label">Custom seed</span>
          <input type="text" id="custom-seed" aria-labelledby="custom-seed-label" disabled>
        </label>

        <label class="seed-option" title="Select a random seed from a specific n-gram order">
          <input type="radio" name="seed" value="random">
          <span id="random-seed-label">Random n-gram</span>
          <input type="number" id="random-seed" value="2" min="2" aria-labelledby="random-seed-label" disabled>
        </label>

        <label class="seed-option" title="Select a random seed from a randomly chosen n-gram order">
          <input type="radio" name="seed" value="full-random">
          <span>Fully random</span>
        </label>
      </div>

      <!-- Model Intensities -->
      <h3 id="weights-dialog-title">Model Weights</h3>
      <div id="weights" class="weights">
        <div id="model-intensities">Loading models...</div>
        <div class="weights-foot">
          <button id="equal-weights" class="text-btn" title="Give every model the same weight, 100%">Equal weights</button>
          <span class="weights-note">Saved in this browser</span>
        </div>
      </div>

      <!-- Close Modal -->
      <button id="close-settings" class="primary-btn" title="Close the settings: they are saved in this browser">
        Close
      </button>

    </div>
  </dialog>

  <script src="tooltip.js"></script>
  <script src="script.js"></script>
</body>

</html>
