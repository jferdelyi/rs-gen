<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Markov Generator 2.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">
    <div class="card">

      <!-- Terminal -->
      <div id="terminal" class="terminal"></div>

      <!-- Generate Button -->
      <button id="generate-btn" class="primary-btn">Generate</button>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="open-settings" class="action-btn">Settings</button>
        <button id="copy-command" class="action-btn" disabled>Copy API URL</button>
        <a href="https://github.com/jferdelyi/rs-gen" target="_blank">
          <img src="github-icon.svg" alt="GitHub" style="width:32px; height:32px; margin-right:4px;">
        </a>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="hidden modal">
    <div class="modal-content">

      <!-- General Settings -->
      <h3>General Settings</h3>

      <div class="input-group">
        <label for="randomness" class="label-title">Randomness</label>
        <div class="slider-inline">
          <input type="range" id="randomness" min="0" max="1" step="0.01" value="0.1">
          <span id="randomness-val" class="slider-value">0.10</span>
        </div>
      </div>

      <div class="input-group">
        <label for="max_n" class="label-title">Max n-gram limit</label>
        <div class="slider-inline">
          <input type="range" id="max_n" min="0" max="100" step="1" value="0">
          <span id="max_n-val" class="slider-value">no limit</span>
        </div>
      </div>

      <div class="input-group">
        <label for="nb_try" class="label-title">Number of tries</label>
        <div class="slider-inline">
          <input type="range" id="nb_try" min="1" max="100" step="1" value="1">
          <span id="nb_try-val" class="slider-value">1</span>
        </div>
      </div>

      <label>
        <input type="checkbox" id="reduce_random"> Advance random
      </label>

      <!-- Seed Options -->
      <div id="seed-options">
        <h3>Seed</h3>
        <label class="seed-option">
          <input type="radio" name="seed" value="none" checked>
          <span>None</span>
        </label>
        <label class="seed-option">
          <input type="radio" name="seed" value="custom">
          <span>Custom</span>
          <input type="text" id="custom-seed" disabled>
        </label>
        <label class="seed-option">
          <input type="radio" name="seed" value="random">
          <span>Random n-gram</span>
          <input type="number" id="random-seed" value="2" min="2" disabled>
        </label>
        <label class="seed-option">
          <input type="radio" name="seed" value="full-random">
          <span>Full Random</span>
        </label>
      </div>

      <!-- Model Intensities -->
      <h3>Model Intensities</h3>
      <div id="model-intensities">Loading models...</div>

      <!-- Close Modal -->
      <button id="close-settings" class="primary-btn">Close</button>

    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
