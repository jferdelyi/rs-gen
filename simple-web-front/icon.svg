<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2130"/>
      <stop offset="0.5" stop-color="#11151F"/>
      <stop offset="1" stop-color="#0B0E15"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="260" y1="280" x2="860" y2="750">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
  </g>
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- a shell prompt ">_" drawn as a Markov chain: the chevron is three states, the cursor is the next symbol -->
  <g transform="translate(-41 0)" filter="url(#shadow)">
    <g fill="none" stroke="url(#ink)" stroke-width="26" stroke-linecap="round">
      <path d="M398.2,381.8 L535,466"/>
      <path d="M535,558 L398.2,642.2"/>
    </g>
    <circle cx="330" cy="340" r="50" fill="none" stroke="url(#ink)" stroke-width="26"/>
    <circle cx="330" cy="684" r="50" fill="none" stroke="url(#ink)" stroke-width="26"/>
    <circle cx="610" cy="512" r="66" fill="url(#ink)"/>
    <rect x="690" y="671" width="150" height="26" rx="13" fill="url(#ink)" opacity="0.85"/>
  </g>
</svg>
